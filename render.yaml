services:
  - type: web
    name: medisync-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: /bin/sh -c 'python init_db.py && exec uvicorn app.main:app --host 0.0.0.0 --port "$PORT"'
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medisync-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"

  - type: web
    name: medisync-frontend
    runtime: docker
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: medisync-db
    databaseName: medisync
    user: medisync
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
